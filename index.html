        body {

            background: radial-gradient(circle at 50% 30%, #2e0854 0%, #180b30 50%, #0c051a 100%);
            color: #ffffff;
            user-select: none;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* Neon & Arcade Glows Inspired by Reference Art */
        .neon-glow-pink {
            box-shadow: 0 0 25px rgba(244, 63, 94, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.5);
        }
        .neon-glow-gold {
            box-shadow: 0 0 25px rgba(251, 191, 36, 0.7), inset 0 0 10px rgba(255, 255, 255, 0.6);
        }
        .neon-glow-blue {
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.5);
        }

        /* Continuous Upward Floating Balloon Motion */
        @keyframes floatUpward {
            0% {
                transform: translateY(110%) translateX(0px) rotate(0deg);
            }
            25% {
                transform: translateY(60%) translateX(15px) rotate(4deg);
            }
            50% {
                transform: translateY(10%) translateX(-15px) rotate(-4deg);
            }
            75% {
                transform: translateY(-40%) translateX(10px) rotate(3deg);
            }
            100% {
                transform: translateY(-90%) translateX(0px) rotate(0deg);
            }
        }

        .balloon-floating-item {
            position: absolute;
            animation: floatUpward linear infinite;
            will-change: transform;
        }

        .balloon-floating-item:active {
            transform: scale(0.9);
        }

        /* Magic Beam Shoot Laser Effect */
        .laser-beam {
            position: absolute;
            pointer-events: none;
            background: linear-gradient(0deg, rgba(255,255,255,1) 0%, rgba(251,191,36,1) 50%, rgba(244,63,94,0) 100%);
            box-shadow: 0 0 15px #fbbf24, 0 0 30px #f43f5e;
            transform-origin: bottom center;
            z-index: 40;
            animation: beamFade 0.25s ease-out forwards;
        }

        @keyframes beamFade {
            0% { opacity: 1; width: 8px; }
            100% { opacity: 0; width: 2px; }
        }

        /* Pop Burst Explosion Effect */
        @keyframes popBurst {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4) rotate(15deg); filter: brightness(1.8); opacity: 0.9; }
            100% { transform: scale(0); opacity: 0; }
        }

        .pop-effect {

        }

    <script>
        // --- Web Audio API Sound Effects ---
        let soundEnabled = true;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'pop') {
                    // Arcade Laser Pop sound
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.08);
                } else if (type === 'wrong') {
                    // Wrong selection sound
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(120, audioCtx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.25);
                } else if (type === 'pass') {
                    // Level Auto Complete Fanfare
                    const now = audioCtx.currentTime;
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
                    osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
                    osc.frequency.setValueAtTime(1046.50, now + 0.24); // C6
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
                    osc.start();
                    osc.stop(now + 0.45);
                } else if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(450, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.05);
                }
            } catch(e){}
        }

        // State variables
        let currentQIndex = 0;
        let score = 0;
        let remainingTargets = 0;
        let autoNextTimeout = null;

        function startGame() {
            playSound('click');
            score = 0;
            currentQIndex = 0;
            document.getElementById('score-text').innerText = score;
            
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');

            loadQuestion();
        }

        function loadQuestion() {
            if (autoNextTimeout) clearTimeout(autoNextTimeout);
            
            // Hide toast
            const toast = document.getElementById('auto-toast');
            toast.classList.add('translate-y-20', 'opacity-0');

            const q = questionsData[currentQIndex];
            
            document.getElementById('unit-badge').innerText = q.unit;
            document.getElementById('level-text').innerText = currentQIndex + 1;
            document.getElementById('target-title').innerText = `任务：击爆【${q.target}】！`;

            const stage = document.getElementById('balloon-stage');
            stage.innerHTML = '';

            // Count targets needed to clear
            remainingTargets = q.balloons.filter(b => b.isTarget).length;

            // Compute floating column positions for balloons
            const total = q.balloons.length;
            q.balloons.forEach((bData, idx) => {
                const colorObj = balloonColors[idx % balloonColors.length];
                
                const balloonWrapper = document.createElement('div');
                balloonWrapper.className = `balloon-floating-item flex flex-col items-center cursor-pointer select-none group z-10`;
                
                // Horizontally space out the floating paths across stage (20% to 80%)
                const horizontalPos = 12 + (idx * (76 / total)) + (Math.random() * 4 - 2);
                balloonWrapper.style.left = `${horizontalPos}%`;
                
                // Randomize float speed (6s to 9s) and staggered start delays (-6s to 0s)
                const duration = 6.5 + Math.random() * 2.5;
                const delay = -1 * (Math.random() * duration);
                balloonWrapper.style.animationDuration = `${duration}s`;
                balloonWrapper.style.animationDelay = `${delay}s`;

                balloonWrapper.innerHTML = `
                    <!-- Target Ring Top Badge (Inspired by Reference Art) -->
                    <div class="w-6 h-6 rounded-full border-2 border-white bg-red-500 flex items-center justify-center mb-0.5 shadow-md">
                        <div class="w-2.5 h-2.5 rounded-full bg-white"></div>
                    </div>
                    
                    <!-- Main Metallic Balloon Body -->
                    <div class="w-28 h-36 sm:w-32 sm:h-40 ${colorObj.bg} ${colorObj.glow} rounded-[50%_50%_50%_50%/40%_40%_60%_60%] flex flex-col items-center justify-center p-2 text-center relative transform group-hover:scale-105 transition">
                        <!-- Shiny Highlight Reflection -->
                        <div class="absolute top-2.5 left-3 w-4 h-9 bg-white/45 rounded-full transform -rotate-45 pointer-events-none"></div>
                        
                        <span class="text-3xl sm:text-4xl mb-1 drop-shadow-md">${bData.icon}</span>
                        <span class="text-xs sm:text-sm font-black ${colorObj.text} leading-tight drop-shadow-md px-1">${bData.text}</span>
                    </div>

                    <!-- Knot & String -->
                    <div class="text-xs text-amber-300 -mt-1"><i class="fa-solid fa-play transform rotate-90"></i></div>
                    <div class="w-0.5 h-12 bg-gradient-to-b from-amber-200 to-transparent"></div>
                `;

                balloonWrapper.onclick = (e) => shootBalloon(e, balloonWrapper, bData);
                stage.appendChild(balloonWrapper);
            });
        }

        function shootBalloon(event, element, data) {
            if (element.classList.contains('popped')) return;

            const rect = element.getBoundingClientRect();
            const clickX = event.clientX || (rect.left + rect.width / 2);
            const clickY = event.clientY || (rect.top + rect.height / 2);

            // Spawn Laser Beam & Particle Explosions
            createLaserEffect(clickX, clickY);

            if (data.isTarget) {
                element.classList.add('popped');
                playSound('pop');
                
                // Pop Explosion Visual
                element.classList.add('pop-effect');
                setTimeout(() => { element.style.visibility = 'hidden'; }, 280);

                score += 10;
                document.getElementById('score-text').innerText = score;
                remainingTargets--;

                // CHECK AUTOMATIC STAGE CLEARING
                if (remainingTargets <= 0) {
                    playSound('pass');
                    
                    // Show Floating Success Toast
                    const toast = document.getElementById('auto-toast');
                    toast.classList.remove('translate-y-20', 'opacity-0');

                    // AUTOMATICALLY TRIGGER NEXT QUESTION AFTER 1.2 SECONDS
                    autoNextTimeout = setTimeout(() => {
                        nextQuestion();
                    }, 1200);
                }
            } else {
                playSound('wrong');
                // Shake penalty effect
                element.classList.add('animate-bounce');
                setTimeout(() => element.classList.remove('animate-bounce'), 600);
            }
        }

        // Shoot Beam and Particle Explosion
        function createLaserEffect(targetX, targetY) {
            // Laser beam line from bottom screen to click position
            const beam = document.createElement('div');
            beam.className = 'laser-beam';
            
            const startX = window.innerWidth / 2;
            const startY = window.innerHeight;
            
            const deltaX = targetX - startX;
            const deltaY = targetY - startY;
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            const angle = Math.atan2(deltaY, deltaX) * (180 / Math.PI) + 90;

            beam.style.height = `${distance}px`;
            beam.style.left = `${startX}px`;
            beam.style.top = `${startY - distance}px`;
            beam.style.transform = `rotate(${angle}deg)`;
            
            document.body.appendChild(beam);
            setTimeout(() => beam.remove(), 250);

            // Sparkle Particle Explosion Burst
            for (let i = 0; i < 6; i++) {
                const p = document.createElement('div');
                p.className = 'fixed pointer-events-none z-50 text-amber-300 text-lg animate-ping';
                p.style.left = `${targetX + (Math.random() * 40 - 20)}px`;
                p.style.top = `${targetY + (Math.random() * 40 - 20)}px`;
                p.innerHTML = Math.random() > 0.5 ? '⭐' : '✨';
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 400);
            }
        }

        function nextQuestion() {
            currentQIndex++;
            if (currentQIndex < questionsData.length) {
                loadQuestion();
            } else {
                endGame();
            }
        }

        function endGame() {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = score;

            const stars = document.getElementById('star-rating');
            const evalText = document.getElementById('evaluation-text');

            if (score >= 260) {
                stars.innerHTML = '<i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i>';
                evalText.innerHTML = "🎉 <strong>太厉害了！满分小勇士！</strong><br>你完全掌握了一年级科学的所有知识，所有的气球都被你精准击爆！";
            } else if (score >= 180) {
                stars.innerHTML = '<i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-regular fa-star"></i>';
                evalText.innerHTML = "🌟 <strong>表现非常棒！</strong><br>你击爆了大部分正确的科学气球！继续保持对科学的热情！";
            } else {
                stars.innerHTML = '<i class="fa-solid fa-star"></i><i class="fa-regular fa-star"></i><i class="fa-regular fa-star"></i>';
                evalText.innerHTML = "💪 <strong>再接再厉！</strong><br>多复习课本上的知识点，再试一次一定能拿下三颗星！";
            }
        }
